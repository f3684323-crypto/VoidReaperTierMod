name: Build Void Reaper Tier Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod jar
        run: gradle build

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: void-reaper-tier-jar
          path: build/libs/*.jar
